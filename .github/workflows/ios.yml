name: iOS

# Builds the iPhone app on a GitHub-hosted Mac, so no Mac is needed locally. The result is an
# unsigned .ipa; AltStore or SideStore signs it with your own Apple ID when installing.
on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WristLink.xcodeproj \
            -scheme WristLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WristLink.app Payload/
          zip -qry WristLink.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristLink-ipa
          path: ios/WristLink.ipa

      # A fixed pre-release, overwritten on every build, so the newest .ipa always has the same
      # download link (handy for opening on the iPhone and sharing to AltStore)
      - name: Publish to the ios-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest ios/WristLink.ipa \
            --prerelease \
            --title "WristLink for iPhone (latest build)" \
            --notes "Unsigned build of ${GITHUB_SHA::7}. Install it with AltStore or SideStore; see ios/README.md."
