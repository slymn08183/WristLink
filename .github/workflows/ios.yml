name: iOS

# Builds the iPhone app on a GitHub-hosted Mac, so no Mac is needed locally. The result is an
# unsigned .ipa; AltStore or SideStore signs it with your own Apple ID when installing.
on:
  push:
    branches: [master]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  build:
    # Intel runners: the arm64 macOS pool often has no capacity and jobs time out unstarted
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WristLink.xcodeproj \
            -scheme WristLink \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="0.1.${GITHUB_RUN_NUMBER}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -40

      # An unsigned build carries no entitlements, and sideloading tools copy the entitlements
      # they find in the app's existing signature when re-signing it. Without this ad-hoc
      # signature the installed app has no HealthKit entitlement ("Missing entitlement").
      - name: Ad-hoc sign with entitlements
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/WristLink.app
          codesign --force --sign - --entitlements WristLink/WristLink.entitlements --timestamp=none "$APP"
          codesign -d --entitlements - "$APP"

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WristLink.app Payload/
          zip -qry WristLink.ipa Payload

      # A SideStore/AltStore source: add its URL once in the app and new builds show up as updates
      # that install on the iPhone itself, no computer needed
      - name: Write source.json
        working-directory: ios
        run: |
          python3 - <<'PY'
          import datetime, json, os
          run = os.environ["GITHUB_RUN_NUMBER"]
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/ios-latest"
          source = {
              "name": "WristLink",
              "identifier": "io.github.slymn08183.wristlink.source",
              "subtitle": "Galaxy Watch on iPhone",
              "website": f"https://github.com/{repo}",
              "apps": [{
                  "name": "WristLink",
                  "bundleIdentifier": "io.github.slymn08183.wristlink",
                  "developerName": "slymn08183",
                  "subtitle": "Galaxy Watch companion",
                  "localizedDescription": "Watch info, settings and Apple Health sync for a Samsung Galaxy Watch running WristLink.",
                  "iconURL": f"https://raw.githubusercontent.com/{repo}/master/docs/brand/app-icon-1024.png",
                  "versions": [{
                      "version": f"0.1.{run}",
                      "buildVersion": run,
                      "date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                      "downloadURL": f"{base}/WristLink.ipa",
                      "size": os.path.getsize("WristLink.ipa"),
                      "minOSVersion": "17.0",
                  }],
                  "appPermissions": {
                      "entitlements": ["com.apple.developer.healthkit"],
                      "privacy": {
                          "NSBluetoothAlwaysUsageDescription": "Talks to your Galaxy Watch over Bluetooth.",
                          "NSHealthUpdateUsageDescription": "Saves steps, heart rate and sleep from your watch.",
                      },
                  },
              }],
              "news": [],
          }
          json.dump(source, open("source.json", "w"), indent=2)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristLink-ipa
          path: ios/WristLink.ipa

      # A fixed pre-release, overwritten on every build, so the newest .ipa always has the same
      # download link (handy for opening on the iPhone and sharing to AltStore)
      - name: Publish to the ios-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest ios/WristLink.ipa ios/source.json \
            --prerelease \
            --title "WristLink for iPhone (latest build)" \
            --notes "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}), unsigned. Install with SideStore or AltStore; see ios/README.md. Source URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/ios-latest/source.json"
